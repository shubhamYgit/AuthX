<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AuthX — Secure JWT Authentication System with role-based access control">
    <title>AuthX — Secure Authentication</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><path d='M50 25L70 37.5V62.5L50 75L30 62.5V37.5Z' stroke='white' stroke-width='5' fill='none'/></svg>">
</head>

<body>

    <div class="animated-bg">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
    </div>

    <div id="app"></div>

    <template id="login-template">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        </svg>
                    </div>
                </div>
                <h1>Welcome back</h1>
                <p class="subtitle">Sign in to your AuthX account</p>

                <form id="login-form" class="auth-form">
                    <div class="form-group">
                        <label for="login-email">Email address</label>
                        <input type="email" id="login-email" name="email" placeholder="you@example.com" required
                            autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" name="password" placeholder="Enter your password"
                            required autocomplete="current-password">
                    </div>

                    <div id="login-error" class="error-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary" id="login-btn">
                        <span class="btn-text">Sign in</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="#" id="goto-signup">Create one</a></p>
                </div>
            </div>
        </div>
    </template>

    <template id="signup-template">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        </svg>
                    </div>
                </div>
                <h1>Create account</h1>
                <p class="subtitle">Get started with AuthX in seconds</p>

                <form id="signup-form" class="auth-form">
                    <div class="form-group">
                        <label for="signup-email">Email address</label>
                        <input type="email" id="signup-email" name="email" placeholder="you@example.com" required
                            autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" name="password" placeholder="Min. 8 characters"
                            required minlength="8" autocomplete="new-password">
                        <div class="password-strength" id="password-strength" style="display: none;">
                            <div class="strength-bar-track">
                                <div class="strength-bar-fill" id="strength-bar" data-strength="0"></div>
                            </div>
                            <span class="strength-label" id="strength-label"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="signup-password-confirm">Confirm password</label>
                        <input type="password" id="signup-password-confirm" name="password-confirm"
                            placeholder="Re-enter your password" required autocomplete="new-password">
                    </div>

                    <div id="signup-error" class="error-message" style="display: none;"></div>
                    <div id="signup-success" class="success-message" style="display: none;"></div>

                    <button type="submit" class="btn btn-primary" id="signup-btn">
                        <span class="btn-text">Create account</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="#" id="goto-login">Sign in</a></p>
                </div>
            </div>
        </div>
    </template>

    <template id="dashboard-template">
        <div class="dashboard">
            <nav class="navbar">
                <div class="navbar-content">
                    <div class="navbar-brand">
                        <div class="brand-logo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                            </svg>
                        </div>
                        <span>AuthX</span>
                    </div>
                    <div class="navbar-actions">
                        <div class="session-timer" id="session-timer">
                            <span class="timer-dot"></span>
                            <span class="timer-label">Session Expires</span>
                            <span id="timer-text">--:--</span>
                        </div>
                        <div class="user-info">
                            <div class="user-avatar" id="user-avatar"></div>
                            <span class="user-email" id="user-email"></span>
                            <span class="user-role-badge" id="user-role-badge"></span>
                        </div>
                        <button class="btn btn-ghost btn-sm" id="logout-btn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </nav>

            <div class="dashboard-layout">
                <aside class="sidebar">
                    <div class="sidebar-section">
                        <h3>Navigation</h3>
                        <ul class="nav-menu">
                            <li><a href="#" class="nav-item active" data-page="overview">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="3" width="7" height="7" />
                                        <rect x="14" y="3" width="7" height="7" />
                                        <rect x="14" y="14" width="7" height="7" />
                                        <rect x="3" y="14" width="7" height="7" />
                                    </svg>
                                    Overview
                                </a></li>
                            <li id="nav-user-test"><a href="#" class="nav-item" data-page="user-test">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                                        <circle cx="12" cy="7" r="4" />
                                    </svg>
                                    User Endpoint
                                </a></li>
                            <li id="nav-admin-test"><a href="#" class="nav-item" data-page="admin-test">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="3" />
                                        <path
                                            d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
                                    </svg>
                                    Admin Endpoint
                                </a></li>
                        </ul>
                    </div>
                </aside>

                <main class="main-content">
                    <div id="page-content"></div>
                </main>
            </div>
        </div>
    </template>

    <template id="overview-page">
        <div class="page-transition">
            <div class="page-header">
                <h2>Dashboard</h2>
                <p>Welcome to your AuthX control panel</p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #6366f1, #818cf8);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                    </div>
                    <div>
                        <div class="stat-label">Status</div>
                        <div class="stat-value">Active</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #a78bfa, #c084fc);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                        </svg>
                    </div>
                    <div>
                        <div class="stat-label">Role</div>
                        <div class="stat-value" id="role-display"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon" style="background: linear-gradient(135deg, #34d399, #6ee7b7);">
                        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0110 0v4" />
                        </svg>
                    </div>
                    <div>
                        <div class="stat-label">Auth</div>
                        <div class="stat-value">JWT</div>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <h3>Account Information</h3>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Email</span>
                        <span class="info-value" id="email-display"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Session</span>
                        <span class="info-value"><span class="status-badge status-success">Connected</span></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Token Type</span>
                        <span class="info-value">Bearer (Access + Refresh)</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Backend</span>
                        <span class="info-value">Spring Boot + Security</span>
                    </div>
                </div>
            </div>

            <div class="content-card token-card">
                <div class="token-header">
                    <h3>JWT Access Token</h3>
                    <button class="btn btn-secondary btn-sm" id="toggle-token-btn">Show Token</button>
                </div>
                <div class="token-display" id="token-display" style="display: none;">
                    <div class="token-raw">
                        <code id="token-value"></code>
                        <button class="btn btn-primary btn-sm" id="copy-token-btn">Copy</button>
                    </div>
                    <div id="copy-success" class="copy-success" style="display: none;">Copied to clipboard!</div>
                    <div class="jwt-decoded" id="jwt-decoded"></div>
                </div>
            </div>
        </div>
    </template>

    <template id="user-test-page">
        <div class="page-transition">
            <div class="page-header">
                <h2>User Endpoint Test</h2>
                <p>Testing <code>/auth/user/test</code> — requires USER or ADMIN role</p>
            </div>
            <div class="content-card">
                <div class="test-result" id="user-test-area">
                    <div class="loading-spinner"></div>
                    <h3 id="user-test-result">Sending request…</h3>
                    <p>Authenticating with your JWT access token</p>
                </div>
            </div>
        </div>
    </template>

    <template id="admin-test-page">
        <div class="page-transition">
            <div class="page-header">
                <h2>Admin Endpoint Test</h2>
                <p>Testing <code>/auth/admin/test</code> — requires ADMIN role</p>
            </div>
            <div class="content-card">
                <div class="test-result" id="admin-test-area">
                    <div class="loading-spinner"></div>
                    <h3 id="admin-test-result">Sending request…</h3>
                    <p>Authenticating with your JWT access token</p>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>

</html>
