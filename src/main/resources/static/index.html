<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthX - Authentication System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>

<!-- Templates -->
<template id="login-template">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="url(#gradient)"/>
                    <path d="M24 14L32 20V28L24 34L16 28V20L24 14Z" stroke="white" stroke-width="2" fill="none"/>
                    <defs>
                        <linearGradient id="gradient" x1="0" y1="0" x2="48" y2="48">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your account to continue</p>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>

                <div id="login-error" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" id="login-btn">
                    <span class="btn-text">Sign in</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="#" id="goto-signup">Sign up</a></p>
            </div>
        </div>
    </div>
</template>

<template id="signup-template">
    <div class="auth-container">
        <div class="auth-card">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <rect width="48" height="48" rx="12" fill="url(#gradient2)"/>
                    <path d="M24 14L32 20V28L24 34L16 28V20L24 14Z" stroke="white" stroke-width="2" fill="none"/>
                    <defs>
                        <linearGradient id="gradient2" x1="0" y1="0" x2="48" y2="48">
                            <stop offset="0%" stop-color="#6366f1"/>
                            <stop offset="100%" stop-color="#8b5cf6"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Create account</h1>
            <p class="subtitle">Sign up to get started with AuthX</p>

            <form id="signup-form" class="auth-form">
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" name="password" placeholder="••••••••" required minlength="6">
                    <small class="input-hint">At least 6 characters</small>
                </div>

                <div class="form-group">
                    <label for="signup-password-confirm">Confirm Password</label>
                    <input type="password" id="signup-password-confirm" name="password-confirm" placeholder="••••••••" required>
                </div>

                <div id="signup-error" class="error-message" style="display: none;"></div>
                <div id="signup-success" class="success-message" style="display: none;"></div>

                <button type="submit" class="btn btn-primary" id="signup-btn">
                    <span class="btn-text">Create account</span>
                    <span class="btn-loader" style="display: none;"></span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="#" id="goto-login">Sign in</a></p>
            </div>
        </div>
    </div>
</template>

<template id="dashboard-template">
    <div class="dashboard">
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <svg width="32" height="32" viewBox="0 0 48 48" fill="none">
                        <rect width="48" height="48" rx="12" fill="url(#gradient3)"/>
                        <path d="M24 14L32 20V28L24 34L16 28V20L24 14Z" stroke="white" stroke-width="2" fill="none"/>
                        <defs>
                            <linearGradient id="gradient3" x1="0" y1="0" x2="48" y2="48">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span>AuthX</span>
                </div>
                <div class="navbar-actions">
                    <div class="user-info">
                        <span class="user-email" id="user-email"></span>
                        <span class="user-role" id="user-role-badge"></span>
                    </div>
                    <button class="btn btn-secondary" id="logout-btn">Logout</button>
                </div>
            </div>
        </nav>

        <div class="dashboard-content">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Navigation</h3>
                    <ul class="nav-menu">
                        <li><a href="#" class="nav-item active" data-page="overview">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/>
                            </svg>
                            Overview
                        </a></li>
                        <li id="nav-user-test" style="display: none;"><a href="#" class="nav-item" data-page="user-test">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
                            </svg>
                            User Test
                        </a></li>
                        <li id="nav-admin-test" style="display: none;"><a href="#" class="nav-item" data-page="admin-test">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                            </svg>
                            Admin Test
                        </a></li>
                    </ul>
                </div>
            </aside>

            <main class="main-content">
                <div id="page-content"></div>
            </main>
        </div>
    </div>
</template>

<template id="overview-page">
    <div class="page-header">
        <h2>Dashboard Overview</h2>
        <p>Welcome to your AuthX dashboard</p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
            </div>
            <div class="stat-content">
                <div class="stat-label">Account Status</div>
                <div class="stat-value">Active</div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div class="stat-content">
                <div class="stat-label">Role</div>
                <div class="stat-value" id="role-display"></div>
            </div>
        </div>

        <div class="stat-card">
            <div class="stat-icon" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <div class="stat-content">
                <div class="stat-label">Authentication</div>
                <div class="stat-value">JWT</div>
            </div>
        </div>
    </div>

    <div class="content-card">
        <h3>System Information</h3>
        <div class="info-grid">
            <div class="info-item">
                <span class="info-label">Email:</span>
                <span class="info-value" id="email-display"></span>
            </div>
            <div class="info-item">
                <span class="info-label">Session Status:</span>
                <span class="info-value"><span class="status-badge status-success">Connected</span></span>
            </div>
            <div class="info-item">
                <span class="info-label">Token Type:</span>
                <span class="info-value">Bearer</span>
            </div>
            <div class="info-item">
                <span class="info-label">Backend:</span>
                <span class="info-value">Spring Boot + Security</span>
            </div>
        </div>
    </div>

    <div class="content-card token-card">
        <div class="token-header">
            <h3>JWT Access Token</h3>
            <button class="btn btn-sm btn-secondary" id="toggle-token-btn">Show Token</button>
        </div>
        <div class="token-display" id="token-display" style="display: none;">
            <div class="token-content">
                <code id="token-value"></code>
                <button class="btn btn-sm btn-primary" id="copy-token-btn">Copy Token</button>
            </div>
            <div id="copy-success" class="copy-success" style="display: none;">Copied to clipboard!</div>
        </div>
    </div>
</template>

<template id="user-test-page">
    <div class="page-header">
        <h2>User Test Page</h2>
        <p>Testing user-level authentication</p>
    </div>

    <div class="content-card">
        <div class="test-result">
            <div class="test-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="20" fill="#10b981" opacity="0.1"/>
                    <path d="M16 24l6 6 12-12" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h3 id="user-test-result">Loading...</h3>
            <p>This endpoint requires USER role authentication</p>
        </div>
    </div>
</template>

<template id="admin-test-page">
    <div class="page-header">
        <h2>Admin Test Page</h2>
        <p>Testing admin-level authentication</p>
    </div>

    <div class="content-card">
        <div class="test-result">
            <div class="test-icon">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <circle cx="24" cy="24" r="20" fill="#8b5cf6" opacity="0.1"/>
                    <path d="M16 24l6 6 12-12" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <h3 id="admin-test-result">Loading...</h3>
            <p>This endpoint requires ADMIN role authentication</p>
        </div>
    </div>
</template>

<script src="app.js"></script>
</body>
</html>
